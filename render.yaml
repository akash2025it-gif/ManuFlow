databases:
  - name: manuflow-postgres
    databaseName: manuflow_db
    user: manuflow_user
    plan: free

services:
  - type: web
    name: manuflow
    runtime: python
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn nit_system.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manuflow-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.8"
