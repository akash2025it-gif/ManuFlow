version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nit_ordertoaudit_db
      POSTGRES_USER: nit_admin
      POSTGRES_PASSWORD: nit_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nit_admin -d nit_ordertoaudit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then
               echo 'Evaluation flag detected: Seeding enterprise benchmark data...' &&
               python manage.py seed_users &&
               python manage.py seed_snacks_benchmark &&
               python manage.py run_nit_production_benchmark &&
               python manage.py run_nit_sales_benchmark;
             fi &&
             gunicorn nit_system.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DEBUG=False
      - DEMO_MODE=False
      - SEED_DEMO_DATA=false
      - SECRET_KEY=nit-trichy-order-to-audit-docker-production-key-2026-safe-eval
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - DATABASE_URL=postgresql://nit_admin:nit_secure_password_2026@db:5432/nit_ordertoaudit_db
      - USE_SQLITE=False
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
