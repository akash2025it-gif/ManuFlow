{% extends 'base.html' %}

{% block title %}500 Server Error | ManuFlow{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="mb-4">
                    <span class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-4">
                        <i class="bi bi-exclamation-octagon-fill display-3"></i>
                    </span>
                </div>
                <h1 class="display-6 fw-bold text-danger mb-2">500</h1>
                <h4 class="fw-semibold mb-3">System Processing Error</h4>
                <p class="text-muted mb-4">
                    An unexpected internal server error occurred while processing your request. 
                    The event has been logged for system auditing.
                </p>
                <div class="d-grid gap-2">
                    <a href="{% url 'home' %}" class="btn btn-primary">
                        <i class="bi bi-house-door me-2"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
