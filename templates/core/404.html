{% extends 'base.html' %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="mb-4">
                    <span class="d-inline-flex align-items-center justify-content-center bg-secondary-subtle text-secondary rounded-circle p-4">
                        <i class="bi bi-compass display-3"></i>
                    </span>
                </div>
                <h1 class="display-6 fw-bold mb-2">404</h1>
                <h4 class="fw-semibold mb-3">Resource Not Found</h4>
                <p class="text-muted mb-4">
                    The requested URL or operational view does not exist in the NIT Trichy Order-to-Audit Management System.
                </p>
                <div class="d-grid gap-2">
                    <a href="{% url 'home' %}" class="btn btn-primary">
                        <i class="bi bi-house-door me-2"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
